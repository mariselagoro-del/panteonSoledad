services:
  - type: web
    name: panteon-la-soledad
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: panteon-db
          property: connectionString

databases:
  - name: panteon-db
    databaseName: PanteonLaSoledad
    plan: free
